services:
  # ───── MySQL ─────
  mysql:
    container_name: scorecard-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: scorecard
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ───── RabbitMQ ─────
  rabbitmq:
    container_name: scorecard-rabbit
    image: rabbitmq:3-management
    # 원격 워커 EC2가 붙을 수 있도록 5672 노출. ⚠️ guest는 localhost 전용이므로
    # .env.prod의 RABBITMQ_USERNAME을 guest 이외로 설정(아래 DEFAULT_USER가 그 계정 생성).
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ───── Redis (Celery result backend) ─────
  # 원격 워커가 chord 결과를 읽고/쓰므로 6379 노출 (보안그룹으로 워커 SG만 허용).
  redis:
    container_name: scorecard-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  # ───── Spring Boot Backend ─────
  backend:
    container_name: scorecard-backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/scorecard?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ENDPOINT: ""
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RAG_SERVICE_URL: http://rag:8000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  # ───── RAG Service (FastAPI) ─────
  rag:
    container_name: scorecard-rag
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    restart: always

  # ───── DSC 진단 엔진 (워커) ─────
  # 워커는 서비스 EC2가 아니라 워커 전용 EC2에서 docker-compose.prod-worker.yml로 실행한다.
  # (벤치마크 'N워커' 측정을 깔끔히 하기 위해 서비스 stack에는 워커를 두지 않음)

  # ───── React Frontend (Nginx) ─────
  frontend:
    container_name: scorecard-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt 인증서(호스트 발급분)를 읽기전용 마운트 → CI/CD 재배포해도 유지
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot webroot(자동 갱신 챌린지용)
      - /home/ec2-user/certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
