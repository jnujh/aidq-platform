# ── HTTP(80): Let's Encrypt 갱신 경로만 통과, 나머지는 HTTPS로 리다이렉트 ──
server {
    listen 80;
    server_name aidq.duckdns.org;

    # certbot webroot 갱신용 (인증서 자동 갱신 시 사용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443): TLS 종료 + 정적 서빙 + /api 리버스 프록시 ──
server {
    listen 443 ssl;
    server_name aidq.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/aidq.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidq.duckdns.org/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/jobs/subscribe {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;        # SSE: 이벤트를 버퍼에 묶지 않고 즉시 전달(실시간성 핵심)
        proxy_cache off;            # SSE: 캐시 금지
        access_log off;             # 보안: 쿼리스트링(?token=...)이 access log에 평문 기록되지 않도록
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
    }
}
